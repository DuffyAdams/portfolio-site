<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (() => {
        try {
          document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
        } catch {
          document.documentElement.classList.remove('dark');
        }
      })();
    </script>
    <meta
      name="description"
      content="Hey, I'm Duffy. I'm a QA engineer at ICSolutions and an SDSU CS grad who builds practical apps and tools, usually because something bugged me."
    />
    <title>Duffy Adams | Developer & QA Engineer</title>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
